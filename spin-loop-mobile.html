<main class="app"><header class="toolbar"><div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="15" cy="17" r="12" stroke="currentColor" stroke-width="2"/><circle cx="23" cy="7" r="5" fill="currentColor" stroke="#0c1929" stroke-width="3"/></svg><h1>SPIN LOOP</h1></div><div class="actions"><button id="fullscreen" class="icon" hidden aria-label="全画面にする"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"/></svg></button><button id="help" class="icon" aria-label="遊び方を表示">？</button><button id="pause" disabled aria-label="ゲームを一時停止">停止</button></div></header>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),c=$('game'),ctx=c.getContext('2d'),overlay=$('overlay'),modal=$('modal');
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));let best=0;try{best=+localStorage.getItem('spin-loop-best-v1')||0}catch{}$('best').textContent=best;
let arenaW=390,activePointer=null,touchMode=false,resumeTimer=0,started=false,previousOrientation=innerWidth>innerHeight;const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;let W=700,H=570,dpr=1,state='ready',rally=0,score=0,clock=0,lastTime=0,acc=0,hitFlash=0,serveTimer=0,particles=[],trail=[],hintTime=0;const keys=new Set();
const player={x:0,y:.89,tx:0,ty:.89,vx:0},cpu={x:0,y:.115};let ball={x:0,y:.17,vx:0,vy:.45,spin:0},spinShown=-1;
const table={top:.14,bottom:.90};
function fitViewport(){document.documentElement.style.setProperty('--app-height',Math.round(window.visualViewport?.height||innerHeight)+'px')}
fitViewport();window.visualViewport?.addEventListener('resize',fitViewport);window.addEventListener('resize',fitViewport);
function resize(){const r=c.getBoundingClientRect();W=Math.max(r.width,1);H=Math.max(r.height,1);arenaW=Math.min(W,H*1.2);dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);particles=[]}
new ResizeObserver(resize).observe(c);
function project(x,y){const width=arenaW*(.62+.25*y);return{x:W/2+x*width/2,y:H*(.07+y*.77)}}
function inverse(px,py){const y=(py/H-.07)/.77;return{x:(px-W/2)/(arenaW*(.62+.25*y)/2),y}}
function hint(title){$('hintTitle').textContent=title;$('touchHint').hidden=false}
function hold(){if(state!=='playing')return;state='hold';activePointer=null;keys.clear();hint('指を置いて再開');$('liveBadge').textContent='PAUSED';$('status').textContent='指を離している間は、ボールも止まります。'}
function waitForTouch(isNew=false){activePointer=null;state='waiting';overlay.hidden=true;$('pause').disabled=false;$('pause').textContent='停止';hint(isNew?'コートに指を置こう':'指を置いて再開');$('liveBadge').textContent='TOUCH TO PLAY';$('status').textContent='下のほうに指を置いて、左右になぞろう。'}

function color(s){return Math.abs(s)<.55?'#76baff':Math.abs(s)<1.15?'#f2c66b':'#f18b7c'}
function updateHUD(){ $('rally').textContent=rally;$('score').textContent=score;if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem('spin-loop-best-v1',best)}catch{}}const n=Math.round(Math.abs(ball.spin)*100);if(n!==spinShown){spinShown=n;$('spinValue').textContent=n+'%';$('spinFill').style.width=Math.min(n/2,100)+'%';$('spinFill').style.background=color(ball.spin);$('spinCaption').textContent=(Math.abs(ball.spin)<.08?'なし':(ball.spin>0?'右へ曲がる':'左へ曲がる'))+' · '+(n<55?'弱':n<115?'中':'強')}}
function prepare(){rally=0;score=0;clock=0;trail=[];particles=[];player.x=0;player.tx=0;player.y=.89;player.ty=.89;player.vx=0;cpu.x=0;ball={x:0,y:.16,vx:0,vy:.45,spin:0};serveTimer=1.0;resumeTimer=0;activePointer=null;hitFlash=0;updateHUD()}
function start(){prepare();started=true;waitForTouch(true)}
function pause(){if(['playing','hold','waiting'].includes(state)){activePointer=null;keys.clear();state='paused';$('touchHint').hidden=true;show('PAUSED','ひと休み。','コートに触れるまで、ボールは動きません。','続ける',()=>waitForTouch());addButton('最初から',confirmReset);$('pause').textContent='再開'}else if(state==='paused')waitForTouch()}
function resume(){waitForTouch()}
function show(tag,title,body,label,fn){modal.replaceChildren();const t=document.createElement('div');t.className='tag';t.textContent=tag;const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=body;const b=document.createElement('button');b.className='primary';b.textContent=label;b.onclick=fn;modal.append(t,h,p,b);overlay.hidden=false;$('touchHint').hidden=true}
function addButton(text,fn){const b=document.createElement('button');b.className='secondary';b.textContent=text;b.onclick=fn;modal.append(b)}
function confirmReset(){show('RESTART','最初から？','現在のラリーをリセットします。','最初からはじめる',start);addButton('戻る',()=>{state='playing';pause()})}
let lastReason='';function end(reason){if(state==='over')return;lastReason=reason;state='over';activePointer=null;$('pause').disabled=true;$('liveBadge').textContent='NICE RALLY';show('NICE RALLY',rally>=10?'いいラリー！':'もう一球、いこう。',reason,'もう一度',start);const stats=document.createElement('div');stats.className='result-stats';for(const [value,label]of[[rally,'RALLY'],[score,'SCORE']]){const el=document.createElement('div');const strong=document.createElement('strong');strong.textContent=value;const span=document.createElement('span');span.textContent=label;el.append(strong,span);stats.append(el)}modal.insertBefore(stats,modal.lastChild);$('status').textContent='ベストスコアは、この端末に保存。'}

function burst(){const p=project(ball.x,ball.y);if(!reducedMotion)for(let i=0;i<8;i++)particles.push({x:p.x,y:p.y,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100,life:.3,max:.3,color:color(ball.spin)});hitFlash=.15}
function launch(toPlayer){const speed=.44+Math.min(rally*.009,.30);const dest=toPlayer?player.y-.035:cpu.y;const time=Math.abs(dest-ball.y)/speed;let target;
if(toPlayer){target=clamp((Math.random()-.5)*1.15+player.x*.15,-.7,.7);ball.spin=clamp(-ball.spin*.62+(Math.random()-.5)*.60,-1.9,1.9)}else{const brush=clamp(player.vx*.37,-1.35,1.35);ball.spin=clamp(ball.spin*.65+brush,-2,2);target=clamp(ball.x*.22+player.vx*.15,-.79,.79)}
const acceleration=ball.spin*.85;ball.vx=(target-ball.x-.5*acceleration*time*time)/time;ball.vy=toPlayer?speed:-speed}
function hitPlayer(){burst();rally++;score+=10+Math.round(Math.abs(ball.spin)*8+Math.abs(player.vx)*3);launch(false);updateHUD();if(rally===1)$('status').textContent='ナイス！ 横に振って、回転をかけよう。';else if(rally%5===0)$('status').textContent=rally+'回つながった！ いい調子。'}
function tick(dt){clock+=dt;const ox=player.x;const left=keys.has('ArrowLeft')||keys.has('a'),right=keys.has('ArrowRight')||keys.has('d');if(left||right)player.tx=clamp(player.tx+(right-left)*1.75*dt,-1.1,1.1);if(keys.has('ArrowUp')||keys.has('w'))player.ty=clamp(player.ty-1.1*dt,.57,1.04);if(keys.has('ArrowDown')||keys.has('s'))player.ty=clamp(player.ty+1.1*dt,.57,1.04);player.x+=(player.tx-player.x)*Math.min(1,dt*26);player.y+=(player.ty-player.y)*Math.min(1,dt*26);player.vx=player.vx*.66+(player.x-ox)/dt*.34;
const ctarget=ball.vy<0?clamp(ball.x+ball.vx*.16,-.95,.95):Math.sin(clock*.8)*.14;cpu.x+=clamp(ctarget-cpu.x,-dt*2.8,dt*2.8);
if(resumeTimer>0){resumeTimer-=dt;return}if(serveTimer>0){serveTimer-=dt;ball.x=cpu.x;ball.y=.16;return}
const prevY=ball.y;ball.vx+=ball.spin*.85*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
if(ball.vy>0){const py=player.y-.035;if(prevY<=py && ball.y>=py && Math.abs(ball.x-player.x)<.38){ball.y=py;hitPlayer()}else if(ball.y>1.12)end('ボールの手前にラケットを合わせよう。')}
else if(prevY>=cpu.y && ball.y<=cpu.y){ball.y=cpu.y;cpu.x=clamp(ball.x,-.95,.95);burst();launch(true);updateHUD()}
if(Math.abs(ball.x)>1.38)end('コースアウト。横に振る強さを少し抑えてみよう。');
trail.push({x:ball.x,y:ball.y});if(trail.length>(reducedMotion?1:12))trail.shift();hitFlash=Math.max(0,hitFlash-dt);particles=particles.filter(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;return p.life>0});hintTime+=dt;if(hintTime>.12){updateHUD();hintTime=0}}
function path(points,fill,stroke,width=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#13283c');g.addColorStop(1,'#0c1929');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.save();ctx.globalAlpha=.10;ctx.fillStyle='#a9c9e8';for(let x=20;x<W;x+=28)for(let y=20;y<H;y+=28)ctx.fillRect(x,y,1,1);ctx.restore();
const corners=[project(-1,0),project(1,0),project(1,1),project(-1,1)];path(corners.map(p=>({x:p.x,y:p.y+12})),'#071321');path(corners,'#244d67','#7190a6',2);
path([project(-1,.5),project(1,.5),project(1,1),project(-1,1)],'#28566f');path(corners,null,'#8eafc2',2);
ctx.beginPath();const a=project(0,0),b=project(0,1);ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle='#8cb0c65c';ctx.lineWidth=1;ctx.stroke();
const nl=project(-1.07,.5),nr=project(1.07,.5);path([{x:nl.x,y:nl.y},{x:nr.x,y:nr.y},{x:nr.x,y:nr.y-17},{x:nl.x,y:nl.y-17}],'#c0d5e321','#c0d5e37a');ctx.beginPath();for(let i=0;i<=36;i++){let x=nl.x+(nr.x-nl.x)*i/36;ctx.moveTo(x,nl.y);ctx.lineTo(x,nl.y-17)}ctx.strokeStyle='#c0d5e332';ctx.stroke();ctx.beginPath();ctx.moveTo(nl.x,nl.y-17);ctx.lineTo(nr.x,nr.y-17);ctx.strokeStyle='#e2edf2';ctx.lineWidth=2;ctx.stroke();
