<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スナックマン</title><style>
:root{color-scheme:light dark;--bg:#fff;--surface:#f9f8f7;--text:#2c2c2b;--muted:#686661;--line:#deddd9;--blue:#176ac0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,sans-serif}main{max-width:840px;margin:auto;padding:20px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}h1{font-size:24px;line-height:1.2;margin:0;letter-spacing:-.6px}h1 span{color:var(--blue)}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;color:var(--muted);margin-bottom:4px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:24px}.board{position:relative;background:#111b2e;border-radius:12px;padding:10px;align-self:start}canvas{display:block;width:100%;height:auto;border-radius:5px;outline:none;touch-action:none}canvas:focus-visible{outline:3px solid #65b7ff;outline-offset:3px}.overlay{position:absolute;inset:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:rgba(10,18,33,.9);border-radius:6px;color:#fff;padding:20px}.overlay[hidden]{display:none}.hero{font-size:46px;margin-bottom:12px}.overlay h2{font-size:24px;margin:0 0 8px}.overlay p{color:#c5d2e5;margin:0 0 20px;font-size:14px;max-width:280px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.stat{background:var(--surface);border:1px solid var(--line);padding:12px;border-radius:8px}.stat label{display:block;font-size:12px;color:var(--muted)}.stat strong{font-size:23px;font-variant-numeric:tabular-nums}button{font:600 14px system-ui;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);padding:10px 14px;cursor:pointer;touch-action:manipulation}button:hover{filter:brightness(.94)}button:focus-visible{outline:3px solid #2783de;outline-offset:3px}button.primary{background:#176ac0;color:#fff;border-color:#176ac0}.actions{display:grid;gap:8px}.guide{margin:16px 0;color:var(--muted);font-size:14px}.guide p{margin:8px 0}.legend{display:flex;gap:8px;align-items:center}.dot{display:inline-block;background:#f0cf7b;width:7px;height:7px;border-radius:50%;flex-shrink:0}.dot.big{width:14px;height:14px}.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:6px;justify-content:center;margin-top:16px}.pad button{padding:0;font-size:20px}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.status{min-height:24px;color:var(--blue);margin:12px 0 0;font-weight:600}.foot{font-size:12px;color:var(--muted);margin:12px 0 0}@media(prefers-color-scheme:dark){:root{--bg:#191919;--surface:#202020;--text:#fff;--muted:#b6b4b0;--line:#51514e;--blue:#81b8f2}}@media(max-width:600px){main{padding:16px}header{margin-bottom:12px}h1{font-size:22px}.layout{grid-template-columns:1fr;gap:12px}.stats{grid-template-columns:repeat(4,1fr);margin:0;grid-column:1/-1}.stat{padding:8px}.stat strong{font-size:19px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{margin-top:12px}.guide{grid-column:1/-1;grid-row:3;margin:8px 0;font-size:14px}.pad{grid-column:2;grid-row:2;margin:10px 0 0}.status{grid-column:1/-1;margin:0}.foot{font-size:12px}.eyebrow{font-size:10px}.badge{display:none}}
</style></head><body><main><header><div><div class="eyebrow">A LITTLE ARCADE BREAK</div><h1>スナック<span>マン</span></h1></div><span class="badge" style="color:var(--muted)">食べて、逃げて、もうひと口。</span></header><div class="layout"><div class="board"><canvas id="game" width="504" height="456" tabindex="0" aria-label="スナックマンの迷路。矢印キーまたはWASDで移動。スペースキーで一時停止。"></canvas><div id="overlay" class="overlay"><div class="hero" aria-hidden="true">🍪</div><h2 id="title">おやつの時間です。</h2><p id="description">迷路のおやつを全部集めよう。大きなおやつで、追いかけてくるモンスターに反撃！</p><button id="start" class="primary">ゲームをはじめる</button></div></div><aside class="controls"><div class="stats"><div class="stat"><label>スコア</label><strong id="score">0</strong></div><div class="stat"><label>ベスト</label><strong id="best">0</strong></div><div class="stat"><label>ライフ</label><strong id="lives">3</strong></div><div class="stat"><label>残り</label><strong id="remaining">0</strong></div></div><div class="actions"><button id="pause">一時停止</button><button id="reset">最初から</button></div><div class="guide"><p>矢印キー / WASD で移動<br>Space で一時停止</p><p class="legend"><span class="dot"></span>おやつ：10点</p><p class="legend"><span class="dot big"></span>大きなおやつ：50点<br>6秒間、反撃できる！</p></div><div class="pad" aria-label="移動ボタン"><button class="up" data-dir="0,-1" aria-label="上へ">↑</button><button class="left" data-dir="-1,0" aria-label="左へ">←</button><button class="down" data-dir="0,1" aria-label="下へ">↓</button><button class="right" data-dir="1,0" aria-label="右へ">→</button></div><p id="status" class="status" role="status" aria-live="polite">ひと休み、ひとゲーム。</p></aside></div><p class="foot">すべてのおやつでクリア。モンスターに触れるとライフが減ります。画面をクリックしてキー操作を開始。</p></main><script>
'use strict';
const map=[
'#####################',
'#o........#........o#',
'#.###.###.#.###.###.#',
'#...................#',
'#.###.#.#####.#.###.#',
'#.....#...#...#.....#',
'#####.###.#.###.#####',
'#.....#.......#.....#',
'#.###.#.##.##.#.###.#',
'#...#....   ....#...#',
'###.#.#.##.##.#.#.###',
'#.....#...#...#.....#',
'#.#######.#.#######.#',
'#......... .........#',
'#.###.#.#####.#.###.#',
'#...#.#...#...#.#...#',
'###.#.###.#.###.#.###',
'#o.................o#',
'#####################'];
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id),size=24,dirs=[{x:1,y:0},{x:0,y:1},{x:-1,y:0},{x:0,y:-1}];
let pellets,player,ghosts,score,lives,state='ready',power=0,invincible=0,last=0,acc=0,best=0,anim=0,respawn=0;
try{best=Number(localStorage.getItem('snackman-best'))||0}catch(e){}$('best').textContent=best;
const walk=(x,y)=>y>=0&&y<map.length&&x>=0&&x<map[0].length&&map[y][x]!=='#';
function spawn(){player={x:10,y:13,px:10,py:13,dir:{x:-1,y:0},next:{x:-1,y:0}};ghosts=[{x:9,y:9,color:'#f18e97'},{x:10,y:9,color:'#8be0de'},{x:11,y:9,color:'#c5a2f0'}].map(g=>({...g,px:g.x,py:g.y,dir:{x:0,y:-1},sleep:0}));invincible=12;power=0;respawn=5}
function init(){tickCount=0;pellets=new Map();map.forEach((row,y)=>[...row].forEach((c,x)=>{if(c==='.'||c==='o')pellets.set(x+','+y,c)}));score=0;lives=3;acc=0;spawn();hud();draw()}
function hud(){ $('score').textContent=score;$('lives').textContent=lives;$('remaining').textContent=pellets.size;if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem('snackman-best',best)}catch(e){}}}
function overlay(title,desc,button){$('title').textContent=title;$('description').textContent=desc;$('start').textContent=button;$('overlay').hidden=false}
function start(){if(state==='paused'){state='playing';$('overlay').hidden=true;$('pause').textContent='一時停止'}else{init();state='playing';$('overlay').hidden=true}$('status').textContent='おやつを全部集めよう！';acc=0;canvas.focus()}
function pause(){if(state==='playing'){state='paused';$('pause').textContent='再開';overlay('ちょっとひと休み。','準備ができたら、続きをどうぞ。','ゲームを再開')}else if(state==='paused')start()}
function direction(x,y){player.next={x,y};canvas.focus()}
function collide(){if(invincible>0)return;for(const g of ghosts){if(g.sleep>0)continue;if((g.x===player.x&&g.y===player.y)||(g.x===player.px&&g.y===player.py&&g.px===player.x&&g.py===player.y)){if(power>0){score+=200;g.x=g.px=10;g.y=g.py=9;g.sleep=12;$('status').textContent='モンスターを食べた！ +200'}else{lives--;hud();if(lives<=0){state='over';overlay('ごちそうさまでした！','スコア '+score+'点。もう一度、迷路に挑戦しよう。','もう一度遊ぶ');$('status').textContent='ゲームオーバー'}else{spawn();$('status').textContent='あと'+lives+'ライフ。もうひと口！'}return}}}}
function distances(tx,ty){let d=new Map([[tx+','+ty,0]]),q=[[tx,ty]];for(let i=0;i<q.length;i++){let[x,y]=q[i];for(let v of dirs){let nx=x+v.x,ny=y+v.y,k=nx+','+ny;if(walk(nx,ny)&&!d.has(k)){d.set(k,d.get(x+','+y)+1);q.push([nx,ny])}}}return d}
let tickCount=0;
function tick(){if(state!=='playing')return;tickCount++;if(respawn>0){respawn--;return}if(power>0)power--;if(invincible>0)invincible--;player.px=player.x;player.py=player.y;if(walk(player.x+player.next.x,player.y+player.next.y))player.dir={...player.next};if(walk(player.x+player.dir.x,player.y+player.dir.y)){player.x+=player.dir.x;player.y+=player.dir.y}let key=player.x+','+player.y;if(pellets.has(key)){let big=pellets.get(key)==='o';score+=big?50:10;pellets.delete(key);if(big){power=40;invincible=0;$('status').textContent='パワーアップ！6秒間、反撃！'}}
// Check current occupancy before enemies move, then crossing collisions afterward.
ghosts.forEach(g=>{g.px=g.x;g.py=g.y});collide();if(state!=='playing'||respawn>0){hud();return}
let dist=distances(player.x,player.y);ghosts.forEach((g,i)=>{if(g.sleep>0){g.sleep--;return}if(tickCount%(power>0?3:4)===(power>0?0:i%4))return;let choices=dirs.filter(v=>walk(g.x+v.x,g.y+v.y));let forward=choices.filter(v=>v.x!==-g.dir.x||v.y!==-g.dir.y);if(forward.length)choices=forward;choices.sort((a,b)=>{let da=dist.get((g.x+a.x)+','+(g.y+a.y))??999,db=dist.get((g.x+b.x)+','+(g.y+b.y))??999;return power>0?db-da:da-db});let v=Math.random()<.18?choices[Math.floor(Math.random()*choices.length)]:choices[0];if(v){g.dir=v;g.x+=v.x;g.y+=v.y}});collide();if(state==='playing'&&!pellets.size){state='won';overlay('おやつ、完食！','おめでとう！ スコア '+score+'点。迷路のおやつを全部集めました。','もう一度遊ぶ');$('status').textContent='クリア！お見事です。'}if(power===1)$('status').textContent='パワー終了。モンスターに気をつけて！';hud()}
function draw(){ctx.fillStyle='#111b2e';ctx.fillRect(0,0,504,456);for(let y=0;y<map.length;y++)for(let x=0;x<map[y].length;x++){let cx=x*size,cy=y*size;if(map[y][x]==='#'){ctx.fillStyle='#193b66';ctx.strokeStyle='#3972ac';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(cx+2,cy+2,20,20,5);ctx.fill();ctx.stroke()}}for(let[k,v]of pellets){let[x,y]=k.split(',').map(Number);ctx.fillStyle=v==='o'?'#ffe2a3':'#e7cd91';ctx.beginPath();ctx.arc(x*size+12,y*size+12,v==='o'?5.5:2,0,Math.PI*2);ctx.fill()}
let fraction=state==='playing'&&respawn===0?Math.min(acc/150,1):1;
function pos(o){return{x:(o.px+(o.x-o.px)*fraction)*size+12,y:(o.py+(o.y-o.py)*fraction)*size+12}}
let p=pos(player);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.atan2(player.dir.y,player.dir.x));ctx.fillStyle=invincible>0&&Math.floor(anim/120)%2?'#fff0ab':'#ffd369';let mouth=state==='playing'?.15+Math.abs(Math.sin(anim/100))*.35:.3;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,10,mouth,Math.PI*2-mouth);ctx.closePath();ctx.fill();ctx.fillStyle='#111b2e';ctx.beginPath();ctx.arc(1,-5,1.5,0,Math.PI*2);ctx.fill();ctx.restore();ghosts.forEach(g=>{if(g.sleep>0)return;let p=pos(g);ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle=power>0?'#5a92ec':g.color;ctx.beginPath();ctx.arc(0,-1,9,Math.PI,0);ctx.lineTo(9,9);ctx.lineTo(4,6);ctx.lineTo(0,9);ctx.lineTo(-4,6);ctx.lineTo(-9,9);ctx.closePath();ctx.fill();for(let x of[-3.5,3.5]){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x,-1,2.6,3.2,0,0,7);ctx.fill();ctx.fillStyle='#172338';ctx.beginPath();ctx.arc(x+g.dir.x*.8,-1+g.dir.y*.8,1.2,0,7);ctx.fill()}ctx.restore()});if(power>0){ctx.fillStyle='#86baff';ctx.fillRect(12,450,480*power/40,3)}}
function loop(t){let dt=Math.min(t-last,60);last=t;anim=t;if(state==='playing'){acc+=dt;while(acc>=150){acc-=150;tick();if(state!=='playing')break}}draw();requestAnimationFrame(loop)}
$('start').onclick=start;$('pause').onclick=pause;$('reset').onclick=()=>{state='ready';init();$('pause').textContent='一時停止';overlay('もう一度、ひと口。','スコアとライフをリセットしました。','ゲームをはじめる');$('status').textContent='準備完了'};document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>direction(...b.dataset.dir.split(',').map(Number)));
const keys={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(keys[e.key]||keys[e.key.toLowerCase()]){e.preventDefault();direction(...(keys[e.key]||keys[e.key.toLowerCase()]))}else if(e.code==='Space'){e.preventDefault();if(state==='ready'||state==='over'||state==='won')start();else pause()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});let touch;canvas.addEventListener('pointerdown',e=>{touch=[e.clientX,e.clientY];canvas.focus()});canvas.addEventListener('pointerup',e=>{if(!touch)return;let dx=e.clientX-touch[0],dy=e.clientY-touch[1];if(Math.max(Math.abs(dx),Math.abs(dy))>12)direction(...(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]));touch=null});init();requestAnimationFrame(loop);
</script></body></html>
