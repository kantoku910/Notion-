<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JUMP GARDEN</title><style>
*{box-sizing:border-box}body{margin:0;background:#f9f8f7;color:#2c2c2b;font-family:system-ui,-apple-system,sans-serif}main{max-width:1000px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}h1{font-size:24px;letter-spacing:2px;margin:0}.sub{font-size:14px;color:#706e68;margin-top:3px}.actions{display:flex;gap:8px}button{font:inherit;font-size:14px;min-height:44px;border:1px solid #ccc9c2;border-radius:8px;padding:8px 14px;background:white;color:#2c2c2b;cursor:pointer}button:focus-visible,canvas:focus-visible{outline:3px solid #2783de;outline-offset:3px}.game{position:relative;overflow:hidden;border-radius:12px;border:1px solid #c6d3c9;background:#c3e7ec}canvas{display:block;width:100%;aspect-ratio:900/390;image-rendering:pixelated}.hud{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;font-size:14px;font-weight:700;pointer-events:none;color:#193e37;text-shadow:0 1px #fff}.hud span{background:#ffffffe6;padding:7px 10px;border-radius:6px}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#15383244}.overlay[hidden]{display:none}.card{max-width:380px;margin:16px;text-align:center;background:#fffdf3;padding:24px;border:2px solid #244a3d;border-radius:12px;box-shadow:5px 5px 0 #244a3d}h2{margin:0 0 8px;font-size:28px}.card p{font-size:15px;line-height:1.6;margin:0 0 16px}.primary{background:#244a3d;color:white;border-color:#244a3d;font-weight:700;min-width:150px}footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:12px}.help{font-size:14px;line-height:1.7;color:#706e68}.controls{display:flex;gap:8px}.controls button{min-width:52px;font-size:20px;touch-action:none;user-select:none}.controls .jump{min-width:82px;background:#f7d578;border-color:#bd973b;font-size:14px;font-weight:700}@media(max-width:520px){main{padding:12px}header{align-items:flex-start}h1{font-size:20px}.sub{font-size:12px}.actions{gap:4px}.actions button{padding:6px 8px}canvas{aspect-ratio:540/390}footer{flex-direction:column;align-items:stretch;gap:8px}.controls{justify-content:center}.hud{left:8px;right:8px;top:8px;font-size:12px}.hud span{padding:5px 7px}.card{padding:18px}h2{font-size:22px}.card p{font-size:14px}}@media(prefers-color-scheme:dark){body{background:#191919;color:#fff}.sub,.help{color:#bdbab3}button{background:#292929;color:#fff;border-color:#666}.card{color:#2c2c2b}.primary{background:#244a3d}.controls .jump{color:#2c2c2b}}
</style></head><body><main><header><div><h1>JUMP GARDEN</h1><div class="sub">小さな冒険、大きなジャンプ。</div></div><div class="actions"><button id="pause" aria-label="一時停止">一時停止</button><button id="reset" aria-label="最初からやり直す">↻ リセット</button></div></header><section class="game" aria-label="横スクロールアクションゲーム"><canvas id="c" width="900" height="390" tabindex="0" aria-label="ゲーム画面。左右キーで移動、スペースでジャンプ。">左右キーで移動、スペースでジャンプするゲームです。</canvas><div class="hud"><span id="coins">COIN 00 / 18</span><span id="lives">LIFE ♥ ♥ ♥</span><span id="distance">WORLD 1–1</span></div><div class="overlay" id="overlay"><div class="card"><h2 id="title">さあ、冒険へ。</h2><p id="message">コインを集めて、丘の向こうの旗を目指そう。<br>敵は上から踏むと倒せます。</p><button class="primary" id="start">ゲームをはじめる →</button></div></div></section><footer><div class="help">← → / A D：移動　Space / ↑：ジャンプ<br>穴に注意！　P：一時停止　R：やり直す</div><div class="controls" aria-label="タッチ操作"><button data-key="left" aria-label="左に移動">◀</button><button data-key="right" aria-label="右に移動">▶</button><button data-key="jump" class="jump" aria-label="ジャンプ">JUMP ↑</button></div></footer><div id="announce" aria-live="polite" style="position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden"></div></main>
<script>
(()=>{'use strict';const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');const $=id=>document.getElementById(id);let state='ready',player,camera=0,coins,enemies,score=0,lives=3,particles=[],frame=0,last=0,acc=0;const input={left:false,right:false,jump:false};let jumpQueued=false;const WORLD=3650,G=326;
const grounds=[{x:0,y:G,w:1000,h:100},{x:1120,y:G,w:1050,h:100},{x:2290,y:G,w:1360,h:100}];const blocks=[{x:290,y:247,w:40,h:40,type:'?'},{x:330,y:247,w:40,h:40,type:'brick'},{x:370,y:247,w:40,h:40,type:'?'},{x:700,y:250,w:150,h:20,type:'ledge'},{x:930,y:220,w:170,h:20,type:'ledge'},{x:1350,y:250,w:120,h:20,type:'ledge'},{x:1510,y:188,w:120,h:20,type:'ledge'},{x:1840,y:246,w:40,h:40,type:'?'},{x:1880,y:246,w:40,h:40,type:'brick'},{x:1920,y:246,w:40,h:40,type:'?'},{x:2100,y:225,w:180,h:20,type:'ledge'},{x:2520,y:282,w:60,h:44,type:'pipe'},{x:2780,y:250,w:140,h:20,type:'ledge'},{x:3020,y:280,w:48,h:46,type:'brick'},{x:3068,y:234,w:48,h:92,type:'brick'},{x:3116,y:188,w:48,h:138,type:'brick'}];let solids;
const coinPositions=[[190,280],[310,202],[390,202],[730,211],[790,211],[970,183],[1040,183],[1240,276],[1380,211],[1540,150],[1600,150],[1860,200],[1940,200],[2150,186],[2220,186],[2690,276],[2820,210],[2890,210]];
function init(){player={x:60,y:G-36,w:26,h:36,vx:0,vy:0,ground:false,face:1,inv:0,coyote:0};camera=0;score=0;lives=3;coins=coinPositions.map(([x,y])=>({x,y,taken:false}));enemies=[{x:560,y:G-26,min:480,max:660},{x:1290,y:G-26,min:1190,max:1330},{x:1720,y:G-26,min:1650,max:1800},{x:2410,y:G-26,min:2340,max:2500},{x:2930,y:G-26,min:2850,max:3010}].map(e=>({...e,w:30,h:26,vx:-0.8,dead:false}));solids=[...grounds,...blocks.map(b=>({...b,used:false}))];particles=[];clearKeys();hud();}
function clearKeys(){input.left=input.right=input.jump=false;jumpQueued=false}function hud(){$('coins').textContent='COIN '+String(score).padStart(2,'0')+' / 18';$('lives').textContent='LIFE '+('♥ '.repeat(lives)||'—');$('distance').textContent=Math.min(100,Math.floor(player.x/3420*100))+'% → GOAL'}
function overlay(title,message,label){$('title').textContent=title;$('message').innerHTML=message;$('start').textContent=label;$('overlay').hidden=false;$('announce').textContent=title;}
function play(){if(state==='paused'){state='playing';}else{init();state='playing'}$('overlay').hidden=true;$('pause').textContent='一時停止';canvas.focus()}
function pause(){if(state==='playing'){state='paused';clearKeys();overlay('ひと休み。','準備ができたら、冒険の続きを。','つづける →');$('pause').textContent='再開'}else if(state==='paused'){play()}}
$('start').onclick=play;$('pause').onclick=pause;$('reset').onclick=()=>{init();state='ready';$('pause').textContent='一時停止';overlay('さあ、もう一度。','コインを集めて、ゴールの旗を目指そう。','ゲームをはじめる →')};
const keyMap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump'};
window.addEventListener('keydown',e=>{if(keyMap[e.code]){e.preventDefault();if(keyMap[e.code]==='jump'&&!input.jump)jumpQueued=true;input[keyMap[e.code]]=true}if(e.code==='KeyP'&&!e.repeat)pause();if(e.code==='KeyR'&&!e.repeat)$('reset').click()});window.addEventListener('keyup',e=>{if(keyMap[e.code]){input[keyMap[e.code]]=false;if(keyMap[e.code]==='jump'&&player.vy<-4)player.vy=-4}});window.addEventListener('blur',()=>{clearKeys();if(state==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);input[k]=true;if(k==='jump')jumpQueued=true};b.onpointerup=b.onpointercancel=()=>{input[k]=false;if(k==='jump'&&player.vy<-4)player.vy=-4}});
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function burst(x,y,color,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*4-1,life:30,color})}
function hurt(fall=false){if(player.inv>0&&!fall)return;lives--;hud();if(!lives){state='over';clearKeys();overlay('あと少し！','集めたコイン：'+score+' / 18<br>ジャンプのタイミングを合わせて再挑戦。','もう一度あそぶ →');return}player.x=camera+45;if(player.x>900&&player.x<1170)player.x=1160;if(player.x>2080&&player.x<2330)player.x=2330;player.x=Math.min(player.x,3370);player.y=100;player.vy=0;player.vx=0;player.inv=110}
function tick(){frame++;if(state!=='playing')return;player.inv=Math.max(0,player.inv-1);player.coyote=player.ground?7:Math.max(0,player.coyote-1);if(jumpQueued&&player.coyote>0){player.vy=-10.8;player.ground=false;player.coyote=0;burst(player.x+13,player.y+36,'#fcf4ca',5)}jumpQueued=false;const dir=(input.right?1:0)-(input.left?1:0);player.vx=dir?Math.max(-3.9,Math.min(3.9,player.vx+dir*.55)):player.vx*.78;if(dir)player.face=dir;
player.x+=player.vx;for(const b of solids)if(hit(player,b)){if(player.vx>0)player.x=b.x-player.w;else if(player.vx<0)player.x=b.x+b.w;player.vx=0}player.x=Math.max(0,Math.min(WORLD-player.w,player.x));const oldY=player.y;player.vy=Math.min(12,player.vy+.48);player.y+=player.vy;player.ground=false;for(const b of solids)if(hit(player,b)){if(player.vy>=0&&oldY+player.h<=b.y+1){player.y=b.y-player.h;player.vy=0;player.ground=true}else if(player.vy<0&&oldY>=b.y+b.h-1){player.y=b.y+b.h;player.vy=0;if(b.type==='?'&&!b.used){b.used=true;burst(b.x+20,b.y-10,'#f9c95b',12)}}}
for(const c of coins)if(!c.taken&&hit(player,{x:c.x-9,y:c.y-12,w:18,h:24})){c.taken=true;score++;burst(c.x,c.y,'#d3a33b');hud()}
for(const e of enemies){if(e.dead)continue;e.x+=e.vx;if(e.x<e.min||e.x>e.max)e.vx*=-1;if(hit(player,e)){if(player.vy>0&&oldY+player.h<=e.y+9){e.dead=true;player.vy=-7.3;burst(e.x+15,e.y,'#a46649')}else hurt()}}
if(player.y>440)hurt(true);if(state!=='playing')return;camera=Math.max(0,Math.min(WORLD-canvas.width,player.x-canvas.width*.32));if(player.x>3420){state='win';clearKeys();burst(player.x,player.y,'#f7cf58',28);overlay('ゴール！','コイン '+score+' / 18 を集めました。<br>ナイスジャンプ！次は全コインに挑戦。','もう一度あそぶ →')}
particles=particles.filter(p=>p.life-->0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.12}hud()}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function cloud(x,y){rect(x,y,76,20,'#fffdf4');rect(x+12,y-12,24,12,'#fffdf4');rect(x+34,y-20,24,20,'#fffdf4');rect(x+66,y+8,22,12,'#fffdf4')}
function draw(){let W=canvas.width;ctx.clearRect(0,0,W,390);rect(0,0,W,390,'#c8e8e9');rect(0,270,W,120,'#dcf0dd');for(let i=0;i<14;i++){let x=i*340-camera*.22;cloud(x+60,82+(i%3)*30)}for(let i=0;i<14;i++){let x=i*360-camera*.42;ctx.fillStyle=i%2?'#a4c9ac':'#b6d5b8';ctx.beginPath();ctx.moveTo(x-100,G);ctx.lineTo(x+70,160+(i%3)*25);ctx.lineTo(x+240,G);ctx.fill();rect(x+66,220,8,60,'#8cb698')}
ctx.save();ctx.translate(-Math.floor(camera),0);for(const b of solids){if(b.x+b.w<camera||b.x>camera+W)continue;if(!b.type){rect(b.x,b.y,b.w,b.h,'#b18357');rect(b.x,b.y,b.w,10,'#427d49');rect(b.x,b.y+10,b.w,5,'#6aa25b');for(let x=b.x+8;x<b.x+b.w;x+=24){rect(x,b.y+24,5,5,'#956744');rect(x+12,b.y+47,4,4,'#d1aa78')}}else if(b.type==='ledge'){rect(b.x,b.y,b.w,b.h,'#966347');rect(b.x,b.y,b.w,6,'#508553');rect(b.x+5,b.y+7,b.w-10,3,'#bf8d69')}else if(b.type==='pipe'){rect(b.x,b.y,b.w,b.h,'#356d54');rect(b.x+8,b.y+5,8,b.h-5,'#79b580');rect(b.x-4,b.y,b.w+8,12,'#28533f');rect(b.x,b.y+2,b.w,6,'#68a976')}else{rect(b.x,b.y,b.w,b.h,b.type==='?'?(b.used?'#9b8e6c':'#e6b451'):'#b77853');rect(b.x+3,b.y+3,b.w-6,3,'#f7d28a');rect(b.x,b.y+b.h-4,b.w,4,'#805f39');if(b.type==='?'&&!b.used){ctx.fillStyle='#634b21';ctx.font='bold 27px monospace';ctx.fillText('?',b.x+12,b.y+30)}else if(b.type==='brick'){for(let y=b.y+16;y<b.y+b.h;y+=16){rect(b.x,y,b.w,2,'#875139');rect(b.x+((y-b.y)%32===16?22:8),y-14,2,14,'#875139')}}}}
for(const c of coins)if(!c.taken){let s=Math.max(3,Math.abs(Math.cos(frame*.05))*14);rect(c.x-s/2,c.y-11,s,22,'#b78728');rect(c.x-s/2+2,c.y-9,Math.max(2,s-4),17,'#ffda6a');rect(c.x-1,c.y-6,2,11,'#fff0a1')}
for(const e of enemies)if(!e.dead){rect(e.x+4,e.y,22,6,'#7b4c3b');rect(e.x,e.y+6,30,14,'#a16b4e');rect(e.x+5,e.y+9,6,7,'#fff8d9');rect(e.x+20,e.y+9,6,7,'#fff8d9');rect(e.x+8,e.y+11,3,5,'#2c3433');rect(e.x+20,e.y+11,3,5,'#2c3433');rect(e.x+2,e.y+22,10,4,'#4b3c32');rect(e.x+19,e.y+22,10,4,'#4b3c32')}
rect(3450,145,5,181,'#335b44');rect(3447,140,11,8,'#f6d368');rect(3455,150,55,32,'#e47b56');rect(3455,182,34,7,'#c45943');ctx.fillStyle='#fff6d7';ctx.font='bold 16px sans-serif';ctx.fillText('GO!',3464,172);rect(3530,264,78,62,'#e9d5a7');rect(3530,254,16,10,'#e9d5a7');rect(3561,254,16,10,'#e9d5a7');rect(3592,254,16,10,'#e9d5a7');rect(3557,293,23,33,'#6c7960');
if(!(player.inv>0&&Math.floor(frame/5)%2)){ctx.save();ctx.translate(Math.round(player.x+13),Math.round(player.y));ctx.scale(player.face,1);rect(-10,0,19,6,'#d76742');rect(-12,5,26,5,'#d76742');rect(-9,10,18,11,'#f4c99a');rect(-10,10,5,7,'#624937');rect(4,12,3,4,'#253f3c');rect(5,18,8,3,'#624937');rect(-10,22,20,7,'#dc8150');rect(-7,23,4,8,'#327082');rect(3,23,4,8,'#327082');rect(-8,29,17,5,'#327082');let step=player.ground&&Math.abs(player.vx)>.3?Math.sin(frame*.3)*3:0;rect(-10-step,33,10,3,'#3b4a45');rect(3+step,33,10,3,'#3b4a45');ctx.restore()}
for(const p of particles)rect(p.x,p.y,4,4,p.color);ctx.restore()}
function resize(){canvas.width=window.innerWidth<520?540:900;camera=Math.max(0,Math.min(WORLD-canvas.width,player.x-canvas.width*.32));draw()}window.addEventListener('resize',resize);init();resize();function loop(t){if(!last)last=t;acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){tick();acc-=1000/60}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
window.gameTest={get state(){return state},get player(){return player},get score(){return score},get enemies(){return enemies},get lives(){return lives},tick,play,pause};
})();
</script></body></html>
