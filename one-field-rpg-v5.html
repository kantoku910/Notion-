function sprite(ctx,type,color,cx,cy,scale=3){let rows=patterns[type]||patterns.slime,mw=Math.max(...rows.map(r=>r.length)),mh=rows.length;ctx.save();ctx.translate(Math.round(cx-mw*scale/2),Math.round(cy-mh*scale/2));rows.forEach((r,y)=>[...r].forEach((v,x)=>{if(v==='.'||v===' ')return;ctx.fillStyle=v==='a'?color:v==='w'?'#faf1cc':v==='b'?'#17202e':'#7a6e78';ctx.fillRect(x*scale,y*scale,scale,scale)}));ctx.restore()}

function canStep(x,y,nx,ny){if(nx<0||nx>=W||ny<0||ny>=H||blockedTile(nx,ny))return false;if(zoneAt(x,y)===zoneAt(nx,ny))return true;return gates.some(([a,b,c,d])=>(x===a&&y===b&&nx===c&&ny===d)||(x===c&&y===d&&nx===a&&ny===b))}
function stopRoute(){clearInterval(routeTimer);routeTimer=null}
function routeTo(tx,ty){let queue=[[p.x,p.y]],visited=new Set([p.x+','+p.y]),parents=new Map(),dest=null;while(queue.length){let [x,y]=queue.shift();if((x===tx&&y===ty)||(blockedTile(tx,ty)&&Math.abs(x-tx)+Math.abs(y-ty)===1)){dest=[x,y];break}for(let [dx,dy] of [[0,-1],[1,0],[0,1],[-1,0]]){let nx=x+dx,ny=y+dy,k=nx+','+ny;if(!visited.has(k)&&canStep(x,y,nx,ny)){visited.add(k);parents.set(k,[x,y]);queue.push([nx,ny])}}}if(!dest)return [];let route=[],pos=dest;while(pos[0]!==p.x||pos[1]!==p.y){route.unshift(pos);pos=parents.get(pos.join(','))}return route}
